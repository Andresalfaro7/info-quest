<section class="p-2">
    <div class="d-flex flex-wrap justify-content-center" *ngIf="blogs.length > 0">
        <div class="p-2 w-100" *ngFor="let blog of blogs; let i = index">
            <div class="card relative p-1 shadow-card w-100">
                <span class="position-absolute rounded-circle px-2 bcg-primary text-white fs-12p">{{i+1}}</span>
                <div class="d-flex justify-content-between p-4">
                    <div class="border-bottom border-info roundeds">
                        <span>Públicado {{blog.today && formatDate(blog.today)}}</span>
                    </div>
                </div>
                <h4 class="text-center">{{blog.title}}</h4>
                <div class="card-body">
                    <h5 class="card-title">{{blog.subtitle}}</h5>
                    <p class="card-text">{{blog.article}}</p>
                    <div class="d-flex justify-content-between">
                        <button [routerLink]="['/editar-blog', blog.id]" class="btn btn-outline-success">
                            Editar
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path stroke-dasharray="20" stroke-dashoffset="20" d="M3 21h18"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.2s" values="20;0"/></path><path stroke-dasharray="48" stroke-dashoffset="48" d="M7 17v-4l10 -10l4 4l-10 10h-4"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.2s" dur="0.6s" values="48;0"/></path><path stroke-dasharray="8" stroke-dashoffset="8" d="M14 6l4 4"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.8s" dur="0.2s" values="8;0"/></path></g></svg>
                        </button>
                        <button type="button" (click)="deleteBlog(blog.id)" class="btn btn-outline-danger">
                            Elimnar
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path stroke-dasharray="64" stroke-dashoffset="64" d="M13 3l6 6v12h-14v-18h8"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.6s" values="64;0"/></path><path stroke-dasharray="14" stroke-dashoffset="14" stroke-width="1" d="M12.5 3v5.5h6.5"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.7s" dur="0.2s" values="14;0"/></path><path stroke-dasharray="10" stroke-dashoffset="10" d="M9 11l6 6"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.9s" dur="0.2s" values="10;0"/></path><path stroke-dasharray="10" stroke-dashoffset="10" d="M15 11l-6 6"><animate fill="freeze" attributeName="stroke-dashoffset" begin="1.1s" dur="0.2s" values="10;0"/></path></g></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="blogs.length === 0">
        <p>No se encontraron registros.</p>
    </div>
</section>
